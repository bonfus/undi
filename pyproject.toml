[project]
name = "undi"
dynamic = [
    "version",
    "description",
    "keywords",
    "readme"
]
requires-python = ">=3.9"
dependencies = [
    "pybind11",
    "numpy",
    "scipy"
]

[project.optional-dependencies]
kubo_toyabe = [
    "pandas",
    "ase"
]

[tool.setuptools.package-data]
"undi.kubo_toyabe" = ["*.txt"]

[build-system]
requires = [
    "setuptools>=42",
    "pybind11",
    "numpy",
    "scipy"
]

build-backend = "setuptools.build_meta"
